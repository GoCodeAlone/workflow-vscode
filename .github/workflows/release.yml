name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gocodealone'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type-check
        run: npx tsc --noEmit

      - name: Compile extension tests
        run: npm run compile

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run extension host tests
        run: xvfb-run -a npm test

      - name: Build extension
        run: npm run build

  release:
    name: GitHub release & Marketplace
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gocodealone'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: '*.vsix'

      - name: Create GitHub Release
        id: github_release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        id: marketplace
        shell: bash
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCE_PAT is unavailable; Marketplace publication was not attempted."
            exit 1
          fi
          npm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Report publication outcomes
        if: ${{ always() }}
        shell: bash
        env:
          GITHUB_RELEASE_OUTCOME: ${{ steps.github_release.outcome }}
          MARKETPLACE_OUTCOME: ${{ steps.marketplace.outcome }}
        run: |
          outcome_label() {
            case "$1" in
              success|failure|cancelled|skipped) printf '%s' "$1" ;;
              *) printf 'not recorded' ;;
            esac
          }
          {
            printf '## Release outcomes\n\n| Channel | Step outcome |\n| --- | --- |\n'
            printf '| GitHub release | %s |\n' "$(outcome_label "$GITHUB_RELEASE_OUTCOME")"
            printf '| Marketplace | %s |\n\n' "$(outcome_label "$MARKETPLACE_OUTCOME")"
            case "$GITHUB_RELEASE_OUTCOME" in
              success) printf 'GitHub release action completed successfully. A Marketplace failure does not roll back that release.\n\n' ;;
              failure|cancelled) printf 'Partial GitHub release or assets may exist; inspect the release action before retrying.\n\n' ;;
              skipped) printf 'GitHub release action was not attempted.\n\n' ;;
              *) printf 'GitHub release outcome was not recorded.\n\n' ;;
            esac
            case "$MARKETPLACE_OUTCOME" in
              success) printf 'Marketplace publish command succeeded; public Marketplace indexing is not independently verified.\n' ;;
              failure|cancelled) printf 'Marketplace publication is not confirmed; inspect the Marketplace step before retrying.\n' ;;
              skipped) printf 'Marketplace publication was not attempted.\n' ;;
              *) printf 'Marketplace outcome was not recorded.\n' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
