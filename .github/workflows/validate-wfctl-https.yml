name: Validate fixed wfctl HTTPS interruption

on:
  push:
    branches:
      - fix/wfctl-download-recovery-20261031
    paths:
      - .github/workflows/validate-wfctl-https.yml
      - src/test/transport/wfctl-https.test.ts

permissions: {}

concurrency:
  group: wfctl-https-candidate-8835da0d
  cancel-in-progress: false

jobs:
  transport:
    if: >-
      ${{ github.event_name == 'push' &&
          github.server_url == 'https://github.com' &&
          github.repository == 'GoCodeAlone/workflow-vscode' &&
          github.repository_id == '1168579241' &&
          github.ref == 'refs/heads/fix/wfctl-download-recovery-20261031' &&
          !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the frozen implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GoCodeAlone/workflow-vscode
          ref: 8835da0dbff81f5545daa9c2dcd4be76990ee74b
          path: candidate
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false

      - name: Check out the reviewed fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GoCodeAlone/workflow-vscode
          ref: ${{ github.sha }}
          path: fixture
          persist-credentials: false
          set-safe-directory: false

      - name: Verify implementation and fixture bindings
        shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = '8835da0dbff81f5545daa9c2dcd4be76990ee74b'
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = '55adaca897f47f8f149a42c13aa4b685c7391af2'
          test "$(git -C candidate show -s --format=%P HEAD)" = 'bba230bf7c764fa97acb6d8625800539c6ad2e8e 3b7c32e5e486dcaf1e8ebc691134578a6d074b99'
          test "$(git -C candidate rev-parse bba230bf7c764fa97acb6d8625800539c6ad2e8e:src/wfctl.ts)" = '51a9fcd14f1c29bcdb4510f2e65647ebf1d60802'
          test "$(git -C fixture rev-parse HEAD)" = "$GITHUB_SHA"
          test -f fixture/src/test/transport/wfctl-https.test.ts
          test ! -L fixture/src/test/transport/wfctl-https.test.ts
          echo 'bd7a6b93c946b53097795f9ca367efe5eafd2883ac87c3c6eb52202638798a0d  fixture/src/test/transport/wfctl-https.test.ts' | sha256sum --check
          echo '7a6aceb508382fa41e35b1dce624226d25698ad6d948c77bc7ecb2dd5c579d4a  candidate/src/wfctl.ts' | sha256sum --check
          echo 'b39a28ddbdd0a52e304be291f6c86a13948120a7a199374ae273e7f10a7b9480  candidate/package-lock.json' | sha256sum --check
          git -C candidate diff --exit-code HEAD
          git -C fixture diff --exit-code HEAD

      - name: Set up Node and the existing scoped registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com
          scope: '@gocodealone'

      - name: Install exact dependencies without lifecycle scripts
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the original regression and fixed real HTTPS behavior
        shell: bash
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_OFFLINE: 'true'
        run: |
          umask 077
          runtime=$(mktemp -d "$RUNNER_TEMP/wfctl-https.XXXXXXXX")
          cleanup() {
            rm -rf -- "$runtime"
            test ! -e "$runtime" && test ! -L "$runtime"
          }
          trap cleanup EXIT
          mkdir -p "$runtime/src/test/transport" "$runtime/src/baseline" "$runtime/tls" "$runtime/tmp"
          cp candidate/src/wfctl.ts "$runtime/src/wfctl.ts"
          cp fixture/src/test/transport/wfctl-https.test.ts "$runtime/src/test/transport/wfctl-https.test.ts"
          git -C candidate show bba230bf7c764fa97acb6d8625800539c6ad2e8e:src/wfctl.ts > "$runtime/src/baseline/wfctl.ts"
          echo "04eb2208537ec6bcbc6749c8a6d338110c7f14a2e7648234137c33db1fbbf531  $runtime/src/baseline/wfctl.ts" | sha256sum --check
          timeout 60s node candidate/node_modules/typescript/lib/tsc.js \
            --module NodeNext --moduleResolution NodeNext --target ES2020 \
            --strict --esModuleInterop --skipLibCheck --noEmitOnError \
            --types node,vscode --typeRoots "$GITHUB_WORKSPACE/candidate/node_modules/@types" \
            --rootDir "$runtime/src" --outDir "$runtime/out" \
            "$runtime/src/wfctl.ts" "$runtime/src/baseline/wfctl.ts" "$runtime/src/test/transport/wfctl-https.test.ts"
          timeout 15s openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$runtime/tls/key.pem" -out "$runtime/tls/cert.pem" -days 1 \
            -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' 2> "$runtime/tls/generation.log"
          export TMPDIR="$runtime/tmp" WFCTL_TLS_DIR="$runtime/tls"
          test_file="$runtime/out/test/transport/wfctl-https.test.js"
          baseline_status=0
          WFCTL_MODULE="$runtime/out/baseline/wfctl.js" timeout 30s node --test --test-reporter=tap "$test_file" > "$runtime/baseline.log" 2>&1 || baseline_status=$?
          cat "$runtime/baseline.log"
          test "$baseline_status" -eq 1
          grep -Fxq 'not ok 1 - real HTTPS interruption preserves the cache and cleans staging' "$runtime/baseline.log"
          grep -Fq 'cached bytes changed while HTTPS transfer is active' "$runtime/baseline.log"
          grep -Fq "code: 'ERR_ASSERTION'" "$runtime/baseline.log"
          grep -Fxq '# tests 1' "$runtime/baseline.log"
          grep -Fxq '# fail 1' "$runtime/baseline.log"
          grep -Fxq '# cancelled 0' "$runtime/baseline.log"
          grep -Fxq '# skipped 0' "$runtime/baseline.log"
          fixed_status=0
          WFCTL_MODULE="$runtime/out/wfctl.js" timeout 30s node --test --test-reporter=tap "$test_file" > "$runtime/fixed.log" 2>&1 || fixed_status=$?
          cat "$runtime/fixed.log"
          test "$fixed_status" -eq 0
          grep -Fxq '# tests 1' "$runtime/fixed.log"
          grep -Fxq '# pass 1' "$runtime/fixed.log"
          grep -Fxq '# fail 0' "$runtime/fixed.log"
          grep -Fxq '# cancelled 0' "$runtime/fixed.log"
          grep -Fxq '# skipped 0' "$runtime/fixed.log"
          remaining=$(find "$runtime/tmp" -mindepth 1 -print -quit)
          test -z "$remaining"
          git -C candidate diff --exit-code HEAD
          git -C fixture diff --exit-code HEAD
          cleanup
          trap - EXIT
          echo 'Owned transport fixture and TLS material removed; baseline rejected and fixed case passed.'
